name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands or code, plus the smallest input file that triggers it. Strip anything confidential from XAML or specs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlowGlyph version
      placeholder: output of `flowglyph --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and OS
    validations:
      required: true
