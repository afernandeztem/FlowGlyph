name: Diagrams

# Rendering needs Node and a headless Chromium, so it only runs when something that changes the
# SVGs changes. Run it by hand from the Actions tab to check the diagrams at any time.
on:
  push:
    branches: [main]
    paths: &diagram-sources
      - docs/assets/**
      - scripts/export_diagrams.mjs
      - scripts/diagram-entry.mjs
      - scripts/package.json
      - scripts/package-lock.json
      - .nvmrc
      - Makefile
      - .github/workflows/diagrams.yml
  pull_request:
    paths: *diagram-sources
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagrams:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: cd scripts && npm ci && npx playwright install --with-deps chromium
      - run: make diagrams
      - run: git diff --exit-code docs/assets
